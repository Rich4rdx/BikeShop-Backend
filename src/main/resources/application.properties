spring.application.name=tienda-bicicletas



spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_bicicletas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Seguridad: los secretos se leen de variables de entorno (ver .env.example)
jwt.secret=${JWT_SECRET:}
app.admin.password=${ADMIN_PASSWORD:}
app.trabajador.password=${TRABAJADOR_PASSWORD:}
