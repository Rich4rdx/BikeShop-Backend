services:

  # ─── BASE DE DATOS ─────────────────────────────────────────────
  db-bicicletas:
    image: mysql:8.0
    container_name: mysql-tienda
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: richard
      MYSQL_DATABASE: tienda_bicicletas
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-tienda
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prichard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── BACKEND SPRING BOOT ───────────────────────────────────────
  api-bicicletas:
    build: .
    container_name: backend-tienda
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db-bicicletas:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-bicicletas:3306/tienda_bicicletas?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: richard
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JACKSON_SERIALIZATION_WRITE-DATES-AS-TIMESTAMPS: "false"
    networks:
      - red-tienda

# ─── VOLÚMENES ────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─── RED ──────────────────────────────────────────────────────────
networks:
  red-tienda:
    driver: bridge
